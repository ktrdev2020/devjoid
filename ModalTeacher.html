                <option value="ครูพิเศษ">ครูพิเศษ</option>

<!-- Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalTitle">ยืนยันการดำเนินการ</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      
      <div class="modal-body">
        <div class="text-center">
          <i class="fas fa-question-circle text-warning" style="font-size: 3rem; margin-bottom: 1rem;"></i>
          <p id="confirmMessage">คุณต้องการดำเนินการนี้หรือไม่?</p>
        </div>
      </div>
      
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="fas fa-times me-1"></i>ยกเลิก
        </button>
        <button type="button" class="btn btn-primary" id="confirmButton" onclick="executeConfirmAction()">
          <i class="fas fa-check me-1"></i>ยืนยัน
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Loading Modal -->
<div class="modal fade" id="loadingModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center p-4">
        <div class="loading-spinner mx-auto mb-3"></div>
        <h6 id="loadingMessage">กำลังโหลด...</h6>
        <p class="text-muted mb-0">กรุณารอสักครู่</p>
      </div>
    </div>
  </div>
</div>

<script>
// Additional modal-specific JavaScript functions
let confirmAction = null;

// Function to show custom loading modal
function showCustomLoading(message = 'กำลังโหลด...') {
  document.getElementById('loadingMessage').textContent = message;
  const loadingModal = new bootstrap.Modal(document.getElementById('loadingModal'));
  loadingModal.show();
}

// Function to hide custom loading modal
function hideCustomLoading() {
  const loadingModal = bootstrap.Modal.getInstance(document.getElementById('loadingModal'));
  if (loadingModal) {
    loadingModal.hide();
  }
}

// Function to show confirmation modal
function showConfirmation(title, message, action) {
  document.getElementById('confirmModalTitle').textContent = title;
  document.getElementById('confirmMessage').textContent = message;
  confirmAction = action;
  
  const confirmModal = new bootstrap.Modal(document.getElementById('confirmModal'));
  confirmModal.show();
}

// Execute confirmed action
function executeConfirmAction() {
  if (confirmAction && typeof confirmAction === 'function') {
    confirmAction();
  }
  
  // Hide modal
  const confirmModal = bootstrap.Modal.getInstance(document.getElementById('confirmModal'));
  if (confirmModal) {
    confirmModal.hide();
  }
}

// Form validation
function validateTeacherForm() {
  const form = document.getElementById('teacherForm');
  const requiredFields = form.querySelectorAll('[required]');
  let isValid = true;
  let firstInvalidField = null;
  
  requiredFields.forEach(field => {
    if (!field.value.trim()) {
      field.classList.add('is-invalid');
      if (!firstInvalidField) {
        firstInvalidField = field;
      }
      isValid = false;
    } else {
      field.classList.remove('is-invalid');
    }
  });
  
  if (!isValid && firstInvalidField) {
    firstInvalidField.focus();
    firstInvalidField.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  
  return isValid;
}

// Real-time validation
document.addEventListener('input', function(event) {
  if (event.target.hasAttribute('required')) {
    if (event.target.value.trim()) {
      event.target.classList.remove('is-invalid');
    }
  }
});

// Clear form when modal is hidden
document.getElementById('teacherModal').addEventListener('hidden.bs.modal', function() {
  const form = document.getElementById('teacherForm');
  form.reset();
  form.querySelectorAll('.is-invalid').forEach(field => {
    field.classList.remove('is-invalid');
  });
});

// Auto-fill school options based on existing data
function populateSchoolOptions() {
  if (dashboardStats && dashboardStats.schoolStats) {
    const schoolSelect = document.getElementById('teacherSchool');
    const existingOptions = Array.from(schoolSelect.options).map(option => option.value);
    
    Object.keys(dashboardStats.schoolStats).forEach(school => {
      if (school !== 'ไม่ระบุ' && !existingOptions.includes(school)) {
        const option = document.createElement('option');
        option.value = school;
        option.textContent = school;
        schoolSelect.appendChild(option);
      }
    });
  }
}

// Custom input for new school
function allowCustomSchool() {
  const schoolSelect = document.getElementById('teacherSchool');
  
  // Add "อื่นๆ" option if not exists
  if (!Array.from(schoolSelect.options).some(option => option.value === 'other')) {
    const otherOption = document.createElement('option');
    otherOption.value = 'other';
    otherOption.textContent = 'อื่นๆ (ระบุเอง)';
    schoolSelect.appendChild(otherOption);
  }
  
  schoolSelect.addEventListener('change', function() {
    if (this.value === 'other') {
      // Create custom input
      const customInput = document.createElement('input');
      customInput.type = 'text';
      customInput.className = 'form-control mt-2';
      customInput.placeholder = 'ระบุชื่อโรงเรียน';
      customInput.required = true;
      customInput.id = 'customSchool';
      
      // Insert after select
      this.parentNode.appendChild(customInput);
      customInput.focus();
      
      // Update hidden value
      customInput.addEventListener('input', function() {
        schoolSelect.setAttribute('data-custom-value', this.value);
      });
    } else {
      // Remove custom input if exists
      const customInput = document.getElementById('customSchool');
      if (customInput) {
        customInput.remove();
      }
      schoolSelect.removeAttribute('data-custom-value');
    }
  });
}

// Initialize modal enhancements
document.addEventListener('DOMContentLoaded', function() {
  allowCustomSchool();
  
  // Populate school options when data is loaded
  if (typeof loadDashboardData === 'function') {
    const originalLoadDashboardData = loadDashboardData;
    loadDashboardData = function() {
      originalLoadDashboardData();
      setTimeout(populateSchoolOptions, 1000);
    };
  }
});

// Enhanced save teacher function
function saveTeacherEnhanced(event) {
  event.preventDefault();
  
  if (!validateTeacherForm()) {
    Swal.fire({
      icon: 'warning',
      title: 'ข้อมูลไม่ครบถ้วน',
      text: 'กรุณากรอกข้อมูลให้ครบถ้วนในฟิลด์ที่จำเป็น',
      confirmButtonText: 'ตกลง'
    });
    return;
  }
  
  const teacherId = document.getElementById('teacherId').value;
  const schoolSelect = document.getElementById('teacherSchool');
  let schoolValue = schoolSelect.value;
  
  // Handle custom school value
  if (schoolValue === 'other') {
    const customSchool = document.getElementById('customSchool');
    if (customSchool && customSchool.value.trim()) {
      schoolValue = customSchool.value.trim();
    } else {
      Swal.fire({
        icon: 'warning',
        title: 'ข้อมูลไม่ครบถ้วน',
        text: 'กรุณาระบุชื่อโรงเรียน',
        confirmButtonText: 'ตกลง'
      });
      return;
    }
  }
  
  const teacherData = {
    code: document.getElementById('teacherCode').value.trim(),
    prefix: document.getElementById('teacherPrefix').value,
    firstName: document.getElementById('teacherFirstName').value.trim(),
    lastName: document.getElementById('teacherLastName').value.trim(),
    position: document.getElementById('teacherPosition').value,
    school: schoolValue
  };
  
  // Additional validation
  if (!teacherData.firstName || !teacherData.lastName || !teacherData.prefix || !teacherData.position || !teacherData.school) {
    Swal.fire({
      icon: 'warning',
      title: 'ข้อมูลไม่ครบถ้วน',
      text: 'กรุณากรอกข้อมูลให้ครบถ้วนในฟิลด์ที่จำเป็น',
      confirmButtonText: 'ตกลง'
    });
    return;
  }
  
  // Call the main save function
  saveTeacher(event);
}

// Override the original save function
if (typeof saveTeacher === 'function') {
  // Backup original function
  window.originalSaveTeacher = saveTeacher;
  // Replace with enhanced version
  window.saveTeacher = saveTeacherEnhanced;
}
</script>
